const icon=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;

const R=[
 ['https://whatsapp.com/channel/0029VaEszsV5vKAHEeERpi0s','whatsapp','Canal do WhatsApp'],
 ['https://t.me/acontecemaranhao2','telegram','Canal do Telegram'],
 ['https://www.youtube.com/@podaconteceroficial','youtube','Pod Acontecer no YouTube'],
 ['https://www.instagram.com/acontece_maranhao/','instagram','Instagram'],
 ['https://x.com/acontece_ma','x','X']
];
const L=[
 ['index.html','link','Notícias no site','acontecemaranhao.com.br','dest'],
 [wa('Olá! Quero anunciar no Acontece Maranhão.'),'megafone','Anuncie no Acontece','Fale com a nossa equipe comercial'],
 [wa('Olá! Gostaria de fazer uma denúncia anônima.'),'denuncia','Faça uma denúncia anônima','Sem se identificar, pelo nosso contato']
];

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('bio-links').innerHTML=L.map(([h,i,t,s,c])=>`<a class="${c||''}" href="${h}"${i==='link'?'':' target="_blank" rel="noopener"'}>${icon(i)}<span>${esc(t)}<small>${esc(s)}</small></span></a>`).join('');
const P=(window.POSTS||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3);
document.getElementById('bio-ult').insertAdjacentHTML('beforeend',P.map(p=>`<a href="materia.html?id=${p.id}">${p.img?`<img src="${p.img}" alt="" loading="lazy">`:''}<span>${esc(p.title)}</span></a>`).join(''));
